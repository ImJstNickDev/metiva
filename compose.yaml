x-service: &service
  image: metiva-service:${METIVA_IMAGE_TAG:-local}
  build:
    context: .
    target: service
  user: "${METIVA_UID:-1000}:${METIVA_GID:-1000}"
  environment:
    METIVA_PUBLIC_URL: ${METIVA_PUBLIC_URL:?Set the public HTTPS origin in .env}
    METIVA_DATA: /data
  volumes:
    - ${METIVA_DATA_DIR:-./data}:/data
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  networks: [backend]

services:
  metiva-api:
    <<: *service
    command: ["api"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s

  metiva-worker:
    <<: *service
    command: ["worker"]
    depends_on:
      metiva-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "metiva", "worker-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  metiva:
    container_name: metiva
    image: metiva-ingress:${METIVA_IMAGE_TAG:-local}
    build:
      context: .
      target: ingress
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${METIVA_DATA_DIR:-./data}/artifacts:/srv/objects:ro
    networks: [backend, prod-frontend]
    depends_on:
      metiva-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      retries: 3
      timeout: 4s

networks:
  backend: {}
  prod-frontend:
    external: true
