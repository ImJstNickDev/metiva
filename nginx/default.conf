limit_req_zone $binary_remote_addr zone=administration:1m rate=30r/s;
limit_req_zone $binary_remote_addr zone=consumers:2m rate=120r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 5m;
    access_log off;
    limit_req_status 429;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location /_objects/ {
        internal;
        alias /srv/objects/;
        disable_symlinks on;
        default_type application/octet-stream;
        types {}
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    }
    # Service discovery follows API container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api metiva-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Host metiva-api;
    location = /healthz { proxy_pass http://$api; }
    location ^~ /api/admin/ {
        limit_req zone=administration burst=120 nodelay;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://$api;
    }
    location ~ ^/(api/|p/) {
        limit_req zone=consumers burst=240 nodelay;
        proxy_pass http://$api;
    }
    location = /docs { absolute_redirect off; return 301 /docs/; }
    location = /docs/ { try_files /docs/index.html =404; }
    location / { try_files $uri /index.html; }
}
