[package]
name = "metiva"
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
fs2 = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "9.8.1", default-features = false, features = ["deflate","bzip2","zstd"] }
rpassword = "7"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
