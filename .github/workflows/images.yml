name: Release
run-name: Release ${{ inputs.tag }} from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New version prepared on main (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

# Serialize different versions too. A retry may reuse staging tags for the same commit.
concurrency:
  group: metiva-production-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  gate:
    name: Check main commit and version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      ghcr: ${{ steps.names.outputs.ghcr }}
      hub: ${{ steps.names.outputs.hub }}
    steps:
      - name: Require a main dispatch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Dispatch the Release workflow from main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check Verify on this exact main push and validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_github.py check "$RELEASE_TAG"
      - name: Resolve registry repositories
        id: names
        env:
          HUB_LOGIN: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
        run: |
          if [[ -z "$HUB_LOGIN" || ! "$HUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::Configure DOCKERHUB_USERNAME and a valid Docker Hub namespace."
            exit 1
          fi
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "hub=docker.io/$HUB_NAMESPACE/metiva" >> "$GITHUB_OUTPUT"

  stage:
    name: Stage both images on GHCR
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      ingress: ${{ steps.build.outputs.ingress }}
      service: ${{ steps.build.outputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sign in to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build missing candidates and record registry digests
        id: build
        env:
          GHCR: ${{ needs.gate.outputs.ghcr }}
        run: |
          for target in ingress service; do
            repo="$GHCR"
            if [[ "$target" == service ]]; then repo="$GHCR-service"; fi
            stage="$repo:sha-$GITHUB_SHA"
            digest=$(python3 tools/release_registry.py lookup "$stage")
            if [[ -z "$digest" ]]; then
              docker buildx build --target "$target" --platform linux/amd64 --push \
                --label "org.opencontainers.image.revision=$GITHUB_SHA" \
                --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                --metadata-file "$RUNNER_TEMP/$target.json" --tag "$stage" .
              built=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/$target.json")
              digest=$(python3 tools/release_registry.py lookup "$stage")
              [[ "$digest" == "$built" ]]
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$target=$digest" >> "$GITHUB_OUTPUT"
            echo "$stage = $digest"
          done

  smoke:
    name: Smoke-test the staged pair
    needs: [gate, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      INGRESS: ${{ needs.gate.outputs.ghcr }}@${{ needs.stage.outputs.ingress }}
      SERVICE: ${{ needs.gate.outputs.ghcr }}-service@${{ needs.stage.outputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sign in to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify the source labels on both digest-pinned images
        run: |
          for image in "$INGRESS" "$SERVICE"; do
            docker pull --platform linux/amd64 "$image"
            revision=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
            source=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")
            [[ "$revision" == "$GITHUB_SHA" && "$source" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ]]
          done
      - name: Start and restart the standalone deployment
        run: |
          python3 tests/compose/standalone.py --compose-file compose-prod.yaml \
            --ingress-image "$INGRESS" --service-image "$SERVICE"

  distribute:
    name: Promote tested digests and package offline assets
    needs: [gate, stage, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact-id }}
    env:
      GHCR: ${{ needs.gate.outputs.ghcr }}
      HUB: ${{ needs.gate.outputs.hub }}
      INGRESS_DIGEST: ${{ needs.stage.outputs.ingress }}
      SERVICE_DIGEST: ${{ needs.stage.outputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Skopeo
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi
      - name: Sign in to both registries
        env:
          GHCR_TOKEN: ${{ github.token }}
          HUB_LOGIN: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$HUB_TOKEN" | docker login docker.io -u "$HUB_LOGIN" --password-stdin
      - name: Promote by digest, verify both registries and create assets
        run: |
          images=(--ghcr "$GHCR" --hub "$HUB" --tag "$RELEASE_TAG"
                  --ingress-digest "$INGRESS_DIGEST" --service-digest "$SERVICE_DIGEST")
          python3 tools/release_registry.py promote "${images[@]}"
          python3 tools/release_registry.py package "${images[@]}" \
            --compose compose-prod.yaml --output "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: bundle
        with:
          name: release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Verify draft assets and publish
    needs: distribute
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.distribute.outputs.artifact }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Check SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --strict --check SHA256SUMS
      - name: Attach and verify draft assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_github.py publish "$RELEASE_TAG" "$RUNNER_TEMP/release"
