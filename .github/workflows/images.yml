name: Versioned images
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to copy from GHCR to Docker Hub
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: ingress
            suffix: ''
          - target: service
            suffix: '-service'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  dockerhub:
    name: Mirror release to Docker Hub
    needs: publish
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.publish.result == 'success' && vars.DOCKERHUB_USERNAME != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Check the release and target namespace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$HUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' | grep -qx true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy and verify both image manifests
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi
          for suffix in '' '-service'; do
            source="ghcr.io/${GITHUB_REPOSITORY,,}$suffix"
            dest="docker.io/$HUB_NAMESPACE/metiva$suffix:$RELEASE_TAG"
            digest=$(skopeo inspect --format '{{.Digest}}' "docker://$source:$RELEASE_TAG")
            skopeo copy --all --preserve-digests "docker://$source@$digest" "docker://$dest"
            test "$(skopeo inspect --format '{{.Digest}}' "docker://$dest")" = "$digest"
          done
